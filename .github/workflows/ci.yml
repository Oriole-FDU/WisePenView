name: Continuous Integration

on:
  push:
    branches: ['main']
  pull_request:
    # Stack PR 的 base 可能是另一条 refactor/* 分支，所有 PR 目标分支都应执行检查。
  # 支持手动重跑完整检查。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Code Quality & Build Gate
    runs-on: ubuntu-latest

    steps:
      # 自动版本 PR 只改 version 字段，跳过完整构建，仅执行轻量版本校验。
      - name: Detect Release PR
        id: release_pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          IS_RELEASE_PR=false
          if [ "${EVENT_NAME}" = "pull_request" ] && [[ "${HEAD_REF}" == chore/release-* ]]; then
            IS_RELEASE_PR=true
          fi
          echo "is_release_pr=${IS_RELEASE_PR}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm/action-setup 从 package.json 的 packageManager 读取唯一版本。
      - name: Install pnpm
        if: steps.release_pr.outputs.is_release_pr != 'true'
        uses: pnpm/action-setup@v4

      # 设置 Node.js，并将缓存机制切换为 pnpm
      - name: Setup Node.js
        if: steps.release_pr.outputs.is_release_pr != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Node.js for Release PR
        if: steps.release_pr.outputs.is_release_pr == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # 严格依赖安装
      # --frozen-lockfile 等价于 npm ci，它严格读取 pnpm-lock.yaml，绝不自动更新依赖
      - name: Install Dependencies
        if: steps.release_pr.outputs.is_release_pr != 'true'
        run: pnpm install --frozen-lockfile

      # 直接复用已安装的 commitlint，避免 Action 额外拉取镜像；PR 与 main push 都会校验。
      - name: Validate Commits
        if: steps.release_pr.outputs.is_release_pr != 'true'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "${ZERO_SHA}" ]; then
            BEFORE_SHA="$(git rev-parse --verify --quiet "${AFTER_SHA}^" || true)"
          fi
          if [ -n "${BEFORE_SHA}" ]; then
            pnpm exec commitlint --from "${BEFORE_SHA}" --to "${AFTER_SHA}" --verbose
          else
            pnpm exec commitlint --to "${AFTER_SHA}" --verbose
          fi

      # 恢复 ESLint 文件级缓存；缓存键只跟随依赖与配置，源码变化由内容哈希失效。
      - name: Restore ESLint cache
        if: steps.release_pr.outputs.is_release_pr != 'true'
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.nvmrc') }}-

      - name: Check whitespace errors
        if: steps.release_pr.outputs.is_release_pr != 'true'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "${ZERO_SHA}" ]; then
            BEFORE_SHA="$(git rev-parse --verify --quiet "${AFTER_SHA}^" || true)"
          fi
          if [ -n "${BEFORE_SHA}" ]; then
            git diff --check "${BEFORE_SHA}...${AFTER_SHA}"
          else
            git show --check --format= "${AFTER_SHA}"
          fi

      # 各检查互不依赖，并行执行以缩短关键路径；
      # 类型检查与 Vite 构建拆开，避免串行等待。
      - name: Static Checks, Type Check & Build
        if: steps.release_pr.outputs.is_release_pr != 'true'
        run: pnpm verify:ci

      - name: Verify Build Artifact
        if: steps.release_pr.outputs.is_release_pr != 'true'
        run: test -s dist/index.html

      - name: Upload Build Artifact
        if: steps.release_pr.outputs.is_release_pr != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisepenview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Validate Patch Version PR
        if: steps.release_pr.outputs.is_release_pr == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_PACKAGE: ${{ runner.temp }}/base-package.json
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if [ "${CHANGED_FILES}" != "package.json" ]; then
            echo "::error::自动版本 PR 只能修改 package.json，实际变更：${CHANGED_FILES:-<无>}"
            exit 1
          fi

          git diff --check "${BASE_SHA}...${HEAD_SHA}"
          git show "${BASE_SHA}:package.json" > "${BASE_PACKAGE}"
          node scripts/check-release-pr.mjs "${BASE_PACKAGE}" package.json
