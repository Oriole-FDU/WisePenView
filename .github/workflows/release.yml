name: 发布版本

# 仅发布 package.json 中尚未打标签的显式版本。自动补丁版本 PR 已退役。
on:
  pull_request_target:
    types: [closed]
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 发布显式版本
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 解析显式版本
        id: release
        run: |
          set -euo pipefail

          git fetch origin main --tags
          TARGET_SHA="$(git rev-parse origin/main)"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "标签 ${TAG} 已存在，跳过发布" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 创建标签与 GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "::error::发布提交 ${TARGET_SHA} 不在 main 上"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "标签 ${TAG} 已存在，跳过发布"
            exit 0
          fi

          gh release create "${TAG}" \
            --target "${TARGET_SHA}" \
            --title "${TAG}" \
            --generate-notes

          echo "已发布 ${TAG}，提交 ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
